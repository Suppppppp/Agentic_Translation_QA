[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-translation-qa"
version = "0.1.0"
description = "Incremental RAG and agent-based QA experiments for Korean-to-English translation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.9,<3",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8.3,<9",
]
baseline = [
    "sacremoses>=0.1",
    "sentencepiece>=0.2",
    "torch>=2.2",
    "transformers>=4.41,<4.57",
]
rag = [
    "sentence-transformers>=3,<6",
]
eda = [
    "datasets>=2.20",
    "matplotlib>=3.8",
    "pandas>=2.2",
]
ml = [
    "datasets>=2.20",
    "matplotlib>=3.8",
    "pandas>=2.2",
    "sacremoses>=0.1",
    "sentence-transformers>=3,<6",
    "sentencepiece>=0.2",
    "torch>=2.2",
    "transformers>=4.41,<4.57",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
    "ml: requires optional ML dependencies and local model weights",
]
